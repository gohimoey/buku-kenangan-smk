name: Build & Release APK

on:
  push:
    branches: [ master, main ]
  tags:
    - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get 2>&1 || echo "deps resolved"

      - name: Build APK (Release)
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: buku-kenangan-v1
          name: v1.0 - Buku Kenangan SMK IHYAUL ULUM
          body: |
            ## Buku Kenangan SMK IHYAUL ULUM v1.0
            
            ### ✅ Fitur
            - Simpan kenangan dengan foto
            - Catatan teks + tanggal
            - QR code export
            - Galeri kenangan
            
            ### 📱 Cara Pakai
            1. Download APK di bawah
            2. Install di Android (Enable Unknown Sources)
            3. Buka aplikasi, tambahkan kenangan pertama!
            4. Scan QR code untuk berbagi kenangan
            
            ### 🔧 Teknologi
            - Flutter + SQLite (offline)
            - Image picker, QR code
            - Package: image_picker, sqflite, qr_flutter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}