name: Build & Release APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 💾 Backup sources
        run: |
          mkdir -p /tmp/backup
          cp -r lib/ /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: 🏗️ Create Android skeleton
        run: |
          flutter create --org com.smkiuh .
          cp -f /tmp/backup/pubspec.yaml .
          rm -rf lib/
          cp -rf /tmp/backup/lib/ ./lib/

      - name: 🔧 Install dependencies
        run: |
          flutter pub get || echo "deps ok"

      - name: 🧪 Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buku-kenangan-v${{ github.run_number }}
          name: Buku Kenangan SMK IHYAUL ULUM v1.0
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true