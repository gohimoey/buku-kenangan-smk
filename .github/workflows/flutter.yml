name: Build & Release APK

on:
  push:
    branches: [ master, main ]
  tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Backup project files
        run: |
          mkdir -p /tmp/backup
          cp -r lib/ /tmp/backup/
          cp pubspec.yaml /tmp/backup/

      - name: Generate Android project
        run: |
          flutter create .
          cp -f /tmp/backup/pubspec.yaml .
          cp -rf /tmp/backup/lib/ ./lib/

      - name: Install dependencies
        run: flutter pub get || echo "deps ok"

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Buku Kenangan SMK IHYAUL ULUM
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}