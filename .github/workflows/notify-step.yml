- name: Notify n8n Webhook
        if: success()
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          PAYLOAD=$(printf '{"app":"buku-kenangan-smk","tag":"%s","repository":"%s","release_url":"%s"}' \
            "$TAG" "$GITHUB_REPOSITORY" "$RELEASE_URL")
          curl -s -X POST "https://n8n.gohim.vip/webhook/flutter-apk-notification" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "Webhook sent: $TAG -> $RELEASE_URL"