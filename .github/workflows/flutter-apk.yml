name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Verify project structure
        run: |
          ls -la android/gradlew
          ls -la android/app/build.gradle

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug --split-debug-info=/tmp/symbols

      - name: Build APK (Release)
        run: flutter build apk --release --split-debug-info=/tmp/symbols

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Git Tag & GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }} - buku-kenangan-smk
          body: |
            ## Buku Kenangan SMK Ihyaul Ulum v2.0.1
            
            ✅ **Profil SMK** - Halaman info sekolah  
            ✅ **Perjurusan** - TKJ, TKR, PBS detail  
            ✅ **BottomNavigationBar** - Navigasi 3 tab  
            ✅ **SQLite Local** - Simpan kenangan dengan foto
            
            ### Instalasi:
            1. Unduh `app-release.apk` di bawah
            2. Buka file > Pasang (aktifkan "Sumber tidak dikenal")
            
            ### Changelog:
            - Tambah halaman Profil (Alamat, Telepon, Email, Website)
            - Tambah halaman Perjurusan (TKJ, TKR, PBS dengan skill detail)
            - Tambah BottomNavigation untuk berpindah halaman
            - Update pubspec.yaml dependencies: path_provider, sqflite, path
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.PAT_TOKEN }}

      - name: Notify n8n Webhook
        if: success()
        run: |
          TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "v${GITHUB_RUN_NUMBER}")
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          PAYLOAD=$(printf '{"app":"buku-kenangan-smk","tag":"%s","repository":"%s","release_url":"%s"}' "$TAG" "$GITHUB_REPOSITORY" "$RELEASE_URL")
          curl -s -X POST "https://n8n.gohim.vip/webhook/flutter-apk-notification" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"