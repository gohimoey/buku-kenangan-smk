name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug --split-debug-info=/tmp/symbols

      - name: Build APK (Release)
        run: flutter build apk --release --split-debug-info=/tmp/symbols

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/release/app-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ github.run_number }} - buku-kenangan-smk
          body: |
            ## Buku Kenangan SMK Ihyaul Ulum v2.0.1
            
            ✅ **Profil SMK** - Halaman info sekolah  
            ✅ **Perjurusan** - TKJ, TKR, PBS detail  
            ✅ **BottomNavigationBar** - Navigasi 3 tab  
            ✅ **SQLite Local** - Simpan kenangan dengan foto
            
            ### Instalasi:
            1. Unduh `app-release.apk` di bawah
            2. Buka file > Pasang (aktifkan "Sumber tidak dikenal")
            
            ### Changelog:
            - Tambah halaman Profil (Alamat, Telepon, Email, Website)
            - Tambah halaman Perjurusan (TKJ, TKR, PBS dengan skill detail)
            - Tambah BottomNavigation untuk berpindah halaman
            - Update pubspec.yaml dependencies: path_provider, sqflite, path
          files: |
            build/app/outputs/flutter-apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify n8n Webhook
        if: github.event_name == 'push'
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${GITHUB_RUN_NUMBER}"
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"event\":\"apk_build\",\"app\":\"buku-kenangan-smk\",\"tag\":\"v${GITHUB_RUN_NUMBER}\",\"repository\":\"${GITHUB_REPOSITORY}\",\"release_url\":\"${RELEASE_URL}\"}" \
            https://n8n.gohim.vip/webhook/flutter-apk-notification