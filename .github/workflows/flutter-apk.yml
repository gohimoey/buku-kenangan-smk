name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          flutter pub get

      # Download fonts
      - name: Download Google Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://github.com/google/fonts/raw/mainOFL.zip
          unzip -q -o github.com/google/fonts/raw/mainOFL.zip -d $HOME/.local/share/fonts
          fc-cache -f

      - name: Build APK (Debug)
        run: |
          flutter build apk --debug --split-debug-info=/tmp/symbols

      - name: Build APK (Release)
        run: |
          flutter build apk --release --split-debug-info=/tmp/symbols

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/release/app-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ github.run_number }}
          body: |
            ## Buku Kenangan SMK Ihyaul Ulum
            
            Versi build otomatis dari GitHub Actions.
            
            ### Cara Pasang:
            1. Unduh file `app-release.apk`
            2. Buka file dengan File Manager / Explorers
            3. Pasang dengan mengetuknya (pastikan 'Sumber tidak dikenal' aktif)
            
            ### Changelog:
            - Build ${{ github.run_number }} - ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}