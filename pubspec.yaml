name: buku_kenangan_smk
description: Buku Kenangan SMK IHYAUL ULUM v2 - Kelas 10/11/12, Jurusan TKJ/TKR/PBS, Foto, Alamat, Nomor HP
publish_to: 'none'
version: 2.0.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.6
  image_picker: 1.1.1
  intl: 0.19.0
  path_provider: 2.1.5
  sqflite: 2.3.0
  path: 1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: MastaGohim
      fonts:
        - file: fonts/Inter-Regular.ttf

# App Branding
application:
  name: Masta Gohim
  package: com.mastagohim.bukukenangan